name: CI GitOps

on:
  push:
    branches:
      - actividad3-argocd
    paths-ignore:
      - "helm/person-master/values-digitalocean.yaml"

permissions:
  contents: write

jobs:
  build-publish-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Generate image tag
        id: vars
        shell: bash
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t registry.digitalocean.com/${{ vars.DIGITALOCEAN_REGISTRY }}/person-master:${{ steps.vars.outputs.image_tag }} .

      - name: Push Docker image
        run: docker push registry.digitalocean.com/${{ vars.DIGITALOCEAN_REGISTRY }}/person-master:${{ steps.vars.outputs.image_tag }}

      - name: Update Helm image tag
        uses: mikefarah/yq@v4
        with:
          cmd: yq -i '.image.repository = "registry.digitalocean.com/${{ vars.DIGITALOCEAN_REGISTRY }}/person-master" | .image.tag = "${{ steps.vars.outputs.image_tag }}"' helm/person-master/values-digitalocean.yaml

      - name: Commit GitOps image tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/person-master/values-digitalocean.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): update person-master image tag [skip ci]"
          git push origin actividad3-argocd
