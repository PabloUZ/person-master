replicaCount: 1

image:
  repository: registry.digitalocean.com/REEMPLAZAR_REGISTRY/person-master
  tag: initial
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

app:
  port: 3000
  env:
    NODE_ENV: prod
    PORT: "3000"
    VERSION: "0.0.1"
    DB_TYPE: mysql
    DB_HOST: person-master-mysql
    DB_PORT: "3306"
    DB_NAME: persons
    # Laboratorio academico: DB_SYNCHRONIZE=true simplifica la creacion del esquema.
    # No es la estrategia recomendada para produccion; en produccion use migraciones.
    DB_SYNCHRONIZE: "true"
  secretName: person-master-db-secret

probes:
  liveness:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

mysql:
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  database: persons
  secretName: person-master-db-secret
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
